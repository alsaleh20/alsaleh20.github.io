<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>الصفحة الشخصية والمشاريع - صالح الحياري</title>
    <link rel="stylesheet" href="style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div class="wrapper">
      <!-- البطاقة التعريفية -->
      <main class="card">
        <img class="avatar" src="images.jpeg" alt="Profile picture" />
        <h1 class="name">الصالح احمد الحياري</h1>
        <p class="location">الأردن</p>
        <p class="bio">"مطور ويب شغوف بالتكنولوجيا والتصميم"</p>
        
        <nav class="links">
          <a class="link" href="https://github.com/alsaleh20" target="_blank">GitHub</a>
          <a class="link" href="https://www.linkedin.com/in/alsaleh-hyari-b2b5b5392/" target="_blank">LinkedIn</a>
          <a class="link" href="http://instagram.com/k_alsaleh20_" target="_blank">Instagram</a>
          <a class="link" href="https://x.com/k_alsaleh20" target="_blank">X (Twitter)</a>
          <a class="link" href="https://www.youtube.com/@alsaleh20" target="_blank">YouTube</a>
          <a class="link" href="https://www.facebook.com/alsaleh.hiary.2025" target="_blank">Facebook</a>
        </nav>
      </main>

      <!-- قسم المشاريع -->
      <section class="projects-section">
        <h2 class="section-title">مشاريعي على GitHub</h2>
        <div id="projects-container" class="projects-grid">
          <div class="loading">جاري تحميل المشاريع...</div>
        </div>
      </section>
    </div>

    <script>
      async function fetchProjects() {
        const username = 'alsaleh20';
        const container = document.getElementById('projects-container');
        try {
          const response = await fetch(`https://api.github.com/users/${username}/repos?sort=updated&per_page=6`);
          if (!response.ok) throw new Error('Failed to fetch');
          const repos = await response.json();
          container.innerHTML = '';
          
          if (repos.length === 0) {
            container.innerHTML = '<p class="no-projects">لا توجد مشاريع عامة حالياً.</p>';
            return;
          }
          
          repos.forEach(repo => {
            if (repo.fork) return; // تخطي المشاريع المنسوخة
            
            const card = document.createElement('div');
            card.className = 'project-card';
            
            card.innerHTML = `
              <h3 class="project-title">
                <a href="${repo.html_url}" target="_blank">${repo.name}</a>
              </h3>
              <p class="project-desc">${repo.description || 'لا يوجد وصف متوفر لهذا المشروع حالياً.'}</p>
              <div class="project-meta">
                ${repo.language ? `<span class="project-lang"><span class="lang-dot" style="background-color: ${getLanguageColor(repo.language)}"></span>${repo.language}</span>` : ''}
                <span class="project-stars">⭐ ${repo.stargazers_count}</span>
              </div>
            `;
            container.appendChild(card);
          });
        } catch (error) {
          container.innerHTML = '<p class="error-msg">فشل في تحميل المشاريع من GitHub. يرجى التحقق من اتصالك بالإنترنت.</p>';
        }
      }

      function getLanguageColor(lang) {
        const colors = {
          JavaScript: '#f1e05a',
          HTML: '#e34c26',
          CSS: '#563d7c',
          Python: '#3572A5',
          TypeScript: '#3178c6',
        };
        return colors[lang] || '#8b949e';
      }

      document.addEventListener('DOMContentLoaded', fetchProjects);
    </script>
  </body>
</html>
